<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title id="page-title">SparkEvents- Compra de Tickets para Eventos Internacionales</title>
    <link rel="stylesheet" href="css/style_index.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">SparkEvents</a> 
        <nav id="main-nav">
            </nav>
    </header>

    <div class="header-images">
        <a href="#" class="filter-link" data-lugar="Destacado">
            <img src="img/logos/Destacado.png" alt="Eventos Destacados">
        </a>
        <a href="#" class="filter-link" data-lugar="Argentina">
            <img src="img/logos/Argentina.png" alt="Eventos en Argentina">
        </a>
        <a href="#" class="filter-link" data-lugar="Global">
            <img src="img/logos/Global.png" alt="Eventos Globales">
        </a>
        <a href="index.html" class="filter-link filter-all">
            <span>Ver Todos los Tickets</span>
        </a>
    </div>

    <main class="container">
        <div class="content-wrapper">

            <div class="shows-section">
                <h2 id="shows-section-title">🎫 Tickets Disponibles:</h2>
                <div class="card-grid" id="shows-grid">
                    <p class="no-shows">Cargando eventos y tickets...</p>
                </div>
            </div>

            <div class="cart-section">
                <div class="cart-header">🛒 Mi Carrito</div>
                <div class="cart-table-wrapper">
                    <table>
                        <thead><tr><th>Ticket</th><th>Precio</th><th>Cant</th></tr></thead>
                        <tbody id="cart-items">
                            <tr><td colspan="3" style="text-align: center; color: #999;">Aún no hay tickets</td></tr>
                            </tbody>
                    </table>
                </div>
                <div class="cart-footer">
                    <p>Subtotal: <span id="cart-subtotal">$0</span></p>
                    <p>Total Final: <span id="cart-total" style="color: #2ecc71;">$0</span></p>
                    <button id="checkout-btn" class="btn-checkout" disabled>Finalizar Compra</button>
                </div>
            </div>
            
        </div>
    </main>

    <footer>
        <p>&copy; 2025 SparkEvents- Gestión de Eventos Internacionales.</p>
    </footer>
    
    <script src="js/auth_check.js"></script> 
    <script src="js/index_logic.js"></script> 
</body>
</html>
