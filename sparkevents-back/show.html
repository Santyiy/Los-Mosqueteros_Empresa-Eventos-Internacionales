<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargando Evento...</title>
    <link rel="stylesheet" href="css/style_index.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">SparkEvents</a> 
        <nav id="main-nav">
            </nav>
    </header>

    <main class="container">
        <div class="content-wrapper">

            <div class="shows-section">
                <div id="message-area" style="color: #e74c3c; margin-bottom: 20px;"></div>
                
                <div class="event-details-card" id="event-details-card">
                    <p>Cargando detalles del evento...</p>
                </div>

                <h3 style="color: #7d00ff; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 40px;">Selecciona tu Ticket y Cantidad</h3>
                <div id="ticket-selection-area">
                    <p>Cargando opciones de tickets...</p>
                </div>

            </div>

            <div class="cart-section">
                <div class="cart-header">🛒 Mi Carrito</div>
                <div class="cart-table-wrapper">
                    <table>
                        <thead><tr><th>Ticket</th><th>Precio</th><th>Cant</th></tr></thead>
                        <tbody id="cart-items">
                            <tr><td colspan="3" style="text-align: center; color: #999;">Añade tickets para ver el resumen</td></tr>
                            </tbody>
                    </table>
                </div>
                <div class="cart-footer">
                    <p>Subtotal: <span id="cart-subtotal">$0</span></p>
                    <p>Total Final: <span id="cart-total" style="color: #2ecc71;">$0</span></p>
                    <button id="checkout-btn" class="btn-checkout" disabled>Finalizar Compra</button>
                </div>
            </div>
            
        </div>
    </main>

    <footer>
        <p>&copy; 2025 SparkEvents - Gestión de Eventos Internacionales.</p>
    </footer>
    
    <script src="js/auth_check.js"></script> 
    <script src="js/show_logic.js"></script> 
</body>
</html>
