<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Shows - Admin</title>
    <link rel="stylesheet" href="../css/style_admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    
    <div class="sidebar">
        <h2>Admin</h2>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="gestionar_shows.html" class="active"><i class="fas fa-calendar-alt"></i> Gestionar Shows</a></li>
            <li><a href="gestionar_stock.html"><i class="fas fa-ticket-alt"></i> Gestionar Stock</a></li>
            <li><a href="../cuenta/logout.js"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></li>
        </ul>
    </div>
    
    <div class="main-content">
        <div class="container">
            <h1><i class="fas fa-calendar-alt"></i> Gestión de Shows</h1>
            
            <div id="message-area" class="alert-container">
                </div>

            <div class="form-card">
                <h2><span id="form-title">Crear Nuevo Show</span></h2>
                <form id="show-form">
                    <input type="hidden" id="show-id" name="id">

                    <div class="form-group">
                        <label for="nombre">Nombre del Evento:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="lugar">Lugar:</label>
                        <input type="text" id="lugar" name="lugar" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="fecha_hora">Fecha y Hora:</label>
                        <input type="datetime-local" id="fecha_hora" name="fecha_hora" required>
                    </div>

                    <div class="form-group">
                        <label for="imagen_url">URL de Imagen:</label>
                        <input type="url" id="imagen_url" name="imagen_url" placeholder="Ej: /img/concierto.jpg" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="descripcion">Descripción:</label>
                        <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
                    </div>
                    
                    <button type="submit" id="submit-button" class="btn btn-success">Guardar Show</button>
                    <button type="button" id="cancel-button" class="btn btn-secondary" style="display:none;">Cancelar Edición</button>
                </form>
            </div>

            <div class="list-card">
                <h2>Shows Registrados</h2>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Fecha</th>
                            <th>Lugar</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="shows-table-body">
                        <tr><td colspan="5">Cargando shows...</td></tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
    
    <script src="../js/admin_auth_check.js"></script> 
    <script src="gestionar_shows.js"></script>
</body>
</html>
