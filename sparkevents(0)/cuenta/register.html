<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="../css/style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="main-container active" id="main-container">
        <div class="main-container__form-box welcome-box">
            <h2 class="welcome-box__title">ÚNETE A Spark</h2>
            <p class="welcome-box__text">Crea tu cuenta para acceder a la preventa y comprar tickets.</p>
        </div>
        <div class="main-container__form-box form-box register-box">
            <h2 class="form-box__title">Sign Up</h2> 
            
            <div id="message-area"></div>

            <form id="register-form">
                <div class="input-box"><label for="nombre">Nombre</label><input type="text" id="nombre" name="nombre" required><i class="fa-solid fa-user icon"></i></div>
                <div class="input-box"><label for="apellido">Apellido</label><input type="text" id="apellido" name="apellido" required><i class="fa-solid fa-user icon"></i></div>
                <div class="input-box"><label for="email">Email</label><input type="email" id="email" name="email" required><i class="fa-solid fa-envelope icon"></i></div>
                <div class="input-box"><label for="password">Password</label><input type="password" id="password" name="password" required><i class="fa-solid fa-lock icon"></i></div>
                <div class="input-box"><label for="confirm_password">Confirmar Password</label><input type="password" id="confirm_password" name="confirm_password" required><i class="fa-solid fa-lock icon"></i></div>

                <button type="submit" class="button">Sign Up</button>

                <p class="form-box__link">¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a></p>
            </form>
        </div>
    </div>
    <script src="register.js"></script>
</body>
</html>
