<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="../css/style_cuenta.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        .profile-container {
            max-width: 800px;
            text-align: left;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .data-table th, .data-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        .data-table th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <div class="wrapper profile-container">
        <h2 id="welcome-message">Mi Perfil</h2>
        
        <div id="message-area"></div>
        
        <h3>Historial de Tickets Comprados</h3>
        
        <table class="data-table">
            <thead>
                <tr>
                    <th>Evento</th>
                    <th>Fecha</th>
                    <th>Cantidad</th>
                    <th>Total Pagado</th>
                </tr>
            </thead>
            <tbody id="purchase-history-body">
                <tr><td colspan="4">Cargando historial...</td></tr>
            </tbody>
        </table>
        
        <p style="margin-top: 30px;"><a href="../index.html">← Volver al Inicio</a></p>
    </div>

    <script src="perfil.js"></script> 
</body>
</html>
